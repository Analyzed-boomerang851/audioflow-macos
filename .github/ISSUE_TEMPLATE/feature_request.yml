name: Feature request
description: Suggest an improvement for AudioFlow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and interaction you would prefer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - System volume
        - Per-app audio
        - Audio devices
        - Menu bar controller
        - Appearance and localization
        - Packaging and distribution
        - Other
    validations:
      required: true

name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AudioFlow. Please avoid sharing private audio or device identifiers.
  - type: input
    id: version
    attributes:
      label: AudioFlow version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6 on MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open AudioFlow
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: System Audio Recording permission
      options:
        - Granted
        - Not granted
        - Not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or non-sensitive logs if they help explain the issue.

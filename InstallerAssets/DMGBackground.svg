<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f2f3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#d9d9dc" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#8e8e93" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#222226" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#111114" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g transform="translate(0 110)">
  <rect width="640" height="420" rx="24" fill="url(#bg)"/>
  <path d="M48 94 C152 18 246 26 330 86 C414 146 502 144 604 62" fill="none" stroke="url(#glass)" stroke-width="34" stroke-linecap="round" opacity="0.78"/>
  <path d="M34 348 C138 270 230 282 320 336 C406 388 506 382 616 300" fill="none" stroke="#111114" stroke-width="42" stroke-linecap="round" opacity="0.035"/>
  <g filter="url(#shadow)">
    <rect x="118" y="38" width="404" height="78" rx="22" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.9"/>
  </g>
  <text x="320" y="70" text-anchor="middle" fill="#161618" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">Install AudioFlow</text>
  <text x="320" y="96" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Drag the app into the Applications folder</text>
  <path d="M258 226 H370" fill="none" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M357 212 L373 226 L357 240" fill="none" stroke="#2c2c2e" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="330" text-anchor="middle" fill="#3a3a3c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">AudioFlow</text>
  <text x="480" y="330" text-anchor="middle" fill="#3a3a3c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Applications</text>
  <text x="320" y="390" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Every sound, exactly where it belongs.</text>
  </g>
</svg>
